[project]
name = "trop-nwm"
version = "0.1.0"
description = "Tropospheric Delay Calculator from Numerical Weather Models"
readme = "README.md"
authors = [
    { name = "Aki", email = "838013444@qq.com" }
]
requires-python = "==3.10.*"
dependencies = [
    "joblib>=1.0.0",
    "netcdf4>=1.6.0",
    "numpy>=1.22.0",
    "rich>=10.0.0",
    "scipy>=1.12.0",
    "xarray>=2022.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/trop_nwm"]

[dependency-groups]
dev = [
    "pyarrow>=23.0.1",
]
